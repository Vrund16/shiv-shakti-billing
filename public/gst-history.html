<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GST Bill History – Shiv Shakti Tiles</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',Arial,sans-serif;background:#f4f7fb;color:#1e293b;}

.topnav{background:#0f2847;padding:0 28px;height:58px;display:flex;align-items:center;justify-space-between;position:sticky;top:0;z-index:100;}
.nav-title{font-size:15px;font-weight:700;color:#fff;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:6px 14px;border-radius:6px;font-size:13px;font-weight:500;color:rgba(255,255,255,.7);text-decoration:none;}
.nav-link:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-link.active{background:rgba(255,255,255,.15);color:#fff;}

.container{max-width:1100px;margin:30px auto;padding:0 20px;}
.card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
h2{font-size:18px;margin-bottom:16px;}

table{width:100%;border-collapse:collapse;margin-top:10px;}
th, td{padding:12px;text-align:left;border-bottom:1px solid #e2e8f0;font-size:13px;}
th{background:#f8fafc;font-weight:600;}
.btn-del{color:red;border:none;background:none;cursor:pointer;font-weight:600;}
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-title">SHIV SHAKTI TILES <span>GST History</span></div>
  <div class="nav-links">
    <a href="/" class="nav-link">New Bill</a>
    <a href="gst-history.html" class="nav-item">GST Bill History</a>
    <a href="/history" class="nav-link">Bill History</a>
  </div>
</nav>

<div class="container">
  <div class="card">
    <h2>📜 Saved GST Tax Invoices</h2>
    <table>
      <thead>
        <tr>
          <th>Invoice No</th>
          <th>Buyer Name</th>
          <th>Date</th>
          <th>GST Rate</th>
          <th>Grand Total</th>
          <th>Saved By</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="gst-history-tbody">
        <tr><td colspan="7">Loading GST bills...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
window.addEventListener('DOMContentLoaded', loadGstHistory);

function loadGstHistory() {
  fetch('/api/gst-bills')
    .then(r => r.json())
    .then(data => {
      const tbody = document.getElementById('gst-history-tbody');
      if (!data.bills || !data.bills.length) {
        tbody.innerHTML = '<tr><td colspan="7">No GST bills saved yet.</td></tr>';
        return;
      }
      tbody.innerHTML = data.bills.map(b => `
        <tr>
          <td><strong>${b.invNo || '-'}</strong></td>
          <td>${b.buyerName || 'Cash Customer'}</td>
          <td>${b.invDate || '-'}</td>
          <td>${b.gstRate || 18}%</td>
          <td><strong>${b.grandTotal || '₹ 0'}</strong></td>
          <td>${b.savedByName || b.savedBy}</td>
          <td><button class="btn-del" onclick="deleteGstBill('${b.id}')">Delete</button></td>
        </tr>
      `).join('');
    });
}

function deleteGstBill(id) {
  if (!confirm('Are you sure you want to delete this GST bill?')) return;
  fetch('/api/gst-bills/' + id, { method: 'DELETE' })
    .then(r => r.json())
    .then(() => loadGstHistory());
}
</script>
</body>
</html>
