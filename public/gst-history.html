<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiv Shakti Tiles – GST History</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',sans-serif;background:#eef2f7;min-height:100vh;color:#1a1a2e;}

.topnav{background:#0f2847;padding:0 28px;height:58px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.nav-brand{display:flex;align-items:center;gap:12px;}
.nav-logo{width:34px;height:34px;background:rgba(255,255,255,.12);border-radius:8px;
  display:flex;align-items:center;justify-content:center;}
.nav-title{font-size:15px;font-weight:700;color:#fff;letter-spacing:.4px;}
.nav-title span{font-weight:300;opacity:.6;font-size:13px;margin-left:6px;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:6px 16px;border-radius:6px;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.7);text-decoration:none;transition:all .15s;}
.nav-link:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-link.active{background:rgba(255,255,255,.15);color:#fff;}

.page{padding:24px 20px 60px;max-width:1000px;margin:0 auto;}

.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,.06);margin-bottom:20px;}
.card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
.card-title{font-size:18px;font-weight:700;color:#0f2847;}

.search-input{padding:8px 14px;border:1px solid #cbd5e1;border-radius:8px;font-size:13px;outline:none;width:240px;}
.search-input:focus{border-color:#0f2847;}

.history-table{width:100%;border-collapse:collapse;font-size:13px;}
.history-table th{background:#f8fafc;color:#374151;font-weight:600;padding:10px 12px;text-align:left;border-bottom:2px solid #e5e7eb;}
.history-table td{padding:12px;border-bottom:1px solid #e5e7eb;vertical-align:middle;}
.history-table tr:hover td{background:#f8fafc;}

.btn-sm{padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;border:none;cursor:pointer;margin-right:4px;}
.btn-edit{background:#0284c7;color:#fff;}
.btn-del{background:#dc2626;color:#fff;}
.btn-clear-all{background:#ef4444;color:#fff;padding:8px 14px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;}

.empty-state{text-align:center;padding:40px 20px;color:#6b7280;font-size:14px;}
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-brand">
    <div class="nav-logo">
      <svg viewBox="0 0 40 40" fill="none" width="20" height="20">
        <rect x="4" y="4" width="14" height="14" rx="2" fill="white" opacity=".9"/>
        <rect x="22" y="4" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="4" y="22" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="22" y="22" width="14" height="14" rx="2" fill="white" opacity=".9"/>
      </svg>
    </div>
    <div class="nav-title">SHIV SHAKTI TILES <span>GST History</span></div>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">New Bill</a>
    <a href="gst-bill.html" class="nav-link">GST Invoice</a>
    <a href="gst-history.html" class="nav-link active">GST Bill History</a>
    <a href="history.html" class="nav-link">Bill History</a>
  </div>
</nav>

<div class="page">
  <div class="card">
    <div class="card-header">
      <div class="card-title">Saved GST Invoices</div>
      <div style="display:flex;gap:10px;">
        <input type="text" id="search-input" class="search-input" placeholder="Search by name, GSTIN or invoice..." oninput="renderHistory()">
        <button class="btn-clear-all" onclick="clearAllGst()">Clear All History</button>
      </div>
    </div>

    <div style="overflow-x:auto;">
      <table class="history-table">
        <thead>
          <tr>
            <th>Inv No.</th>
            <th>Date</th>
            <th>Customer / Firm</th>
            <th>Party GSTIN</th>
            <th>Grand Total</th>
            <th style="text-align:right;">Actions</th>
          </tr>
        </thead>
        <tbody id="history-body"></tbody>
      </table>
    </div>
    <div id="empty-state" class="empty-state" style="display:none;">No GST invoices saved yet.</div>
  </div>
</div>

<script>
function getGstBills() {
  const stored = localStorage.getItem('gst_bills') || localStorage.getItem('gstBills');
  if (stored) {
    try {
      const parsed = JSON.parse(stored);
      return Array.isArray(parsed) ? parsed : [parsed];
    } catch(e) { return []; }
  }
  return [];
}

function renderHistory() {
  const bills = getGstBills();
  const query = (document.getElementById('search-input').value || '').toLowerCase();
  const tbody = document.getElementById('history-body');
  const emptyState = document.getElementById('empty-state');

  const filtered = bills.filter(b => {
    const inv = (b.invoiceNo || b.billNo || '').toLowerCase();
    const name = (b.partyName || b.customerName || '').toLowerCase();
    const gstin = (b.partyGstin || b.customerGstin || '').toLowerCase();
    return inv.includes(query) || name.includes(query) || gstin.includes(query);
  });

  tbody.innerHTML = '';

  if (filtered.length === 0) {
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  filtered.forEach(b => {
    const tr = document.createElement('tr');
    const total = b.grandTotal || b.totalAmount || b.total || '0.00';
    tr.innerHTML = `
      <td><strong>${b.invoiceNo || b.billNo || 'N/A'}</strong></td>
      <td>${b.invoiceDate || b.date || 'N/A'}</td>
      <td>${b.partyName || b.customerName || 'Customer'}</td>
      <td>${b.partyGstin || b.customerGstin || 'N/A'}</td>
      <td><strong>₹ ${total}</strong></td>
      <td style="text-align:right;">
        <button class="btn-sm btn-edit" onclick="editBill('${b.id || b.invoiceNo}')">View / Edit</button>
        <button class="btn-sm btn-del" onclick="deleteBill('${b.id || b.invoiceNo}')">Delete</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function editBill(id) {
  window.location.href = `gst-bill.html?edit=${encodeURIComponent(id)}`;
}

function deleteBill(id) {
  if (!confirm('Are you sure you want to delete this GST invoice?')) return;
  let bills = getGstBills();
  bills = bills.filter(b => String(b.id) !== String(id) && String(b.invoiceNo) !== String(id));
  localStorage.setItem('gst_bills', JSON.stringify(bills));
  localStorage.setItem('gstBills', JSON.stringify(bills));
  renderHistory();
}

function clearAllGst() {
  if (!confirm('Warning: This will permanently delete ALL saved GST invoices. Continue?')) return;
  localStorage.removeItem('gst_bills');
  localStorage.removeItem('gstBills');
  renderHistory();
}

document.addEventListener('DOMContentLoaded', renderHistory);
</script>
</body>
</html>
