<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiv Shakti Tiles – Bill History</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter','Segoe UI',sans-serif;background:#eef2f7;min-height:100vh;color:#1a1a2e;}
.topnav{background:#0f2847;padding:0 28px;height:58px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 12px rgba(0,0,0,.25);}
.nav-brand{display:flex;align-items:center;gap:12px;}
.nav-logo{width:34px;height:34px;background:rgba(255,255,255,.12);border-radius:8px;
  display:flex;align-items:center;justify-content:center;}
.nav-logo svg{width:20px;height:20px;}
.nav-title{font-size:15px;font-weight:700;color:#fff;}
.nav-title span{font-weight:300;opacity:.6;font-size:13px;margin-left:6px;}
.nav-links{display:flex;gap:4px;}
.nav-link{padding:6px 16px;border-radius:6px;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.7);text-decoration:none;border:1px solid transparent;}
.nav-link:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-link.active{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.2);}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-user{font-size:13px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px;}
.user-avatar{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:rgba(255,255,255,.85);padding:6px 14px;border-radius:6px;font-size:13px;
  font-family:inherit;cursor:pointer;}
.page{padding:24px 20px 60px;max-width:1100px;margin:0 auto;}
.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.stat-card{background:#fff;border-radius:12px;padding:18px 20px;box-shadow:0 1px 6px rgba(0,0,0,.07);}
.stat-label{font-size:12px;color:#6b7280;font-weight:500;margin-bottom:6px;}
.stat-value{font-size:26px;font-weight:700;color:#0f2847;}
.stat-sub{font-size:11px;color:#9ca3af;margin-top:3px;}
.filter-card{background:#fff;border-radius:12px;padding:16px 20px;margin-bottom:18px;
  box-shadow:0 1px 6px rgba(0,0,0,.07);}
.filter-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.filter-top-label{font-size:13px;font-weight:600;color:#0f2847;white-space:nowrap;}
.search-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.stab{padding:6px 16px;border-radius:20px;font-size:12.5px;font-weight:600;cursor:pointer;
  border:1.5px solid #e5e7eb;background:#f9fafb;color:#6b7280;font-family:inherit;}
.stab.active{background:#0f2847;color:#fff;border-color:#0f2847;}
.filter-bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.search-wrap{position:relative;flex:1;min-width:220px;}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#9ca3af;pointer-events:none;}
.search-icon svg{width:16px;height:16px;}
.search-input{width:100%;padding:9px 12px 9px 38px;border:1.5px solid #e5e7eb;border-radius:8px;
  font-size:13px;font-family:inherit;outline:none;background:#fafafa;}
.search-input:focus{border-color:#0f2847;background:#fff;}
.sort-select{padding:9px 14px;border:1.5px solid #e5e7eb;border-radius:8px;
  font-size:13px;font-family:inherit;outline:none;background:#fafafa;cursor:pointer;}
.results-count{font-size:12px;color:#9ca3af;white-space:nowrap;}
.btn-new{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border-radius:8px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;background:#1a3a5c;
  color:#fff;border:none;text-decoration:none;}
.btn-new svg{width:15px;height:15px;}
.bills-container{display:flex;flex-direction:column;gap:14px;}
.bill-card{background:#fff;border-radius:12px;box-shadow:0 1px 8px rgba(0,0,0,.08);overflow:hidden;}
.bill-card-header{display:flex;align-items:center;gap:14px;padding:15px 20px;cursor:pointer;user-select:none;}
.bill-num-badge{background:#0f2847;color:#fff;font-size:12px;font-weight:700;padding:5px 13px;
  border-radius:6px;white-space:nowrap;min-width:72px;text-align:center;}
.bill-card-info{flex:1;min-width:0;}
.bill-card-name{font-size:14px;font-weight:600;color:#0f2847;}
.bill-card-meta{font-size:12px;color:#6b7280;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap;}
.bill-card-total{text-align:right;flex-shrink:0;}
.bill-total-amt{font-size:18px;font-weight:700;color:#059669;}
.bill-total-label{font-size:11px;color:#9ca3af;}
.card-toggle{font-size:22px;color:#9ca3af;transition:transform .25s;line-height:1;flex-shrink:0;}
.bill-card.open .card-toggle{transform:rotate(180deg);color:#0f2847;}
.bill-detail{display:none;border-top:1px solid #f0f0f0;}
.bill-card.open .bill-detail{display:block;}
.bill-detail-inner{padding:0 20px 20px;}
.mini-bill{font-family:Arial,sans-serif;font-size:12px;color:#111;margin-top:14px;}
.mini-header{text-align:center;border-bottom:2px double #1a3a5c;padding-bottom:9px;margin-bottom:8px;}
.mini-shop-en{font-size:17px;font-weight:800;color:#0f2847;letter-spacing:2px;}
.mini-shop-gu{font-size:12.5px;font-weight:600;color:#1a3a5c;}
.mini-addr{font-size:10px;color:#555;margin-top:3px;}
.mini-meta{display:flex;justify-content:space-between;font-size:11px;margin:6px 0;}
.mini-party{background:#f8fafc;border:1px solid #e5e7eb;border-radius:6px;padding:8px 12px;margin:6px 0;font-size:11px;}
.mini-party-row{display:flex;gap:8px;margin-bottom:3px;}
.mini-party-key{font-weight:700;min-width:100px;}
.mini-table{width:100%;border-collapse:collapse;font-size:11px;margin:6px 0;}
.mini-table th{background:#0f2847;color:#fff;padding:5px 7px;text-align:center;font-size:10.5px;border:.5px solid #1a3a5c;}
.mini-table th.dl{text-align:left;}
.mini-table td{border:.5px solid #ddd;padding:4px 6px;text-align:center;}
.mini-table td.dl{text-align:left;}
.mini-table tbody tr:nth-child(even) td{background:#f8fafc;}
.mini-total-row td{background:#0f2847;color:#fff;font-weight:700;border:.5px solid #1a3a5c;padding:6px 7px;}
.mini-footer{display:flex;justify-content:space-between;margin-top:10px;font-size:10.5px;color:#444;}
.mini-sign-line{border-top:1px solid #444;width:110px;padding-top:4px;text-align:center;margin-top:22px;}
.mini-gstin{border-top:1px solid #e5e7eb;padding-top:6px;margin-top:8px;font-size:10px;color:#6b7280;
  display:flex;justify-content:space-between;flex-wrap:wrap;gap:3px;}
.bill-actions{display:flex;gap:10px;margin-top:14px;padding-top:14px;
  border-top:1px solid #f0f0f0;flex-wrap:wrap;align-items:center;}
.act-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:7px;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;border:none;}
.act-edit{background:#1a3a5c;color:#fff;}
.act-delete{background:#fff;color:#dc2626;border:1.5px solid #fecaca;}
.act-btn svg{width:15px;height:15px;}
.saved-by{margin-left:auto;font-size:11px;color:#9ca3af;line-height:1.6;text-align:right;}
mark{background:#fef08a;border-radius:2px;padding:0 1px;}
.empty-state{text-align:center;padding:60px 20px;color:#9ca3af;}
.empty-state svg{width:56px;height:56px;margin-bottom:16px;opacity:.35;}
.empty-state h3{font-size:16px;font-weight:600;color:#6b7280;margin-bottom:6px;}
.empty-state p{font-size:13px;}
.loading{text-align:center;padding:40px;color:#6b7280;font-size:14px;}
.toast{position:fixed;bottom:28px;right:28px;padding:13px 22px;border-radius:10px;font-size:13px;
  font-weight:600;font-family:inherit;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;
  pointer-events:none;transform:translateY(8px);transition:opacity .25s,transform .25s;z-index:9999;}
.toast.show{opacity:1;transform:translateY(0);}
.toast-success{background:#059669;color:#fff;}
.toast-error{background:#dc2626;color:#fff;}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:1000;
  align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:#fff;border-radius:14px;padding:28px;width:360px;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.modal h3{font-size:17px;font-weight:700;color:#0f2847;margin-bottom:8px;}
.modal p{font-size:13px;color:#6b7280;line-height:1.6;margin-bottom:22px;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;}
.modal-cancel{padding:9px 18px;border-radius:7px;background:#f3f4f6;border:1.5px solid #e5e7eb;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
.modal-confirm{padding:9px 18px;border-radius:7px;background:#dc2626;color:#fff;border:none;
  font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav-brand">
    <div class="nav-logo">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="4" y="4" width="14" height="14" rx="2" fill="white" opacity=".9"/>
        <rect x="22" y="4" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="4" y="22" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="22" y="22" width="14" height="14" rx="2" fill="white" opacity=".9"/>
      </svg>
    </div>
    <div class="nav-title">SHIV SHAKTI TILES <span>Billing</span></div>
  </div>
  <div class="nav-links">
    <a href="/" class="nav-link">New Bill</a>
    <a href="gst-history.html" class="nav-item">GST Bill History</a>
    <a href="/history" class="nav-link active">Bill History</a>
  </div>
  <div class="nav-right">
    <div class="nav-user">
      <div class="user-avatar" id="user-initials">–</div>
      <span id="user-name">Loading...</span>
    </div>
    <button class="btn-logout" onclick="location.href='/logout'">Sign Out</button>
  </div>
</nav>

<div class="page">
  <div class="stats-row">
    <div class="stat-card"><div class="stat-label">Total Bills</div><div class="stat-value" id="stat-total">–</div><div class="stat-sub">All time</div></div>
    <div class="stat-card"><div class="stat-label">Total Revenue</div><div class="stat-value" id="stat-rev">–</div><div class="stat-sub">Sum of all bills</div></div>
    <div class="stat-card"><div class="stat-label">This Month</div><div class="stat-value" id="stat-month">–</div><div class="stat-sub" id="stat-month-lbl">Bills</div></div>
    <div class="stat-card"><div class="stat-label">Latest Bill</div><div class="stat-value" id="stat-latest" style="font-size:16px;margin-top:4px;">–</div><div class="stat-sub" id="stat-latest-date">–</div></div>
  </div>

  <div class="filter-card">
    <div class="filter-top">
      <span class="filter-top-label">🔍 Search by :</span>
      <div class="search-tabs">
        <button class="stab active" data-mode="name">👤 Customer Name</button>
        <button class="stab" data-mode="phone">📞 Phone Number</button>
        <button class="stab" data-mode="billno">🧾 Bill No.</button>
      </div>
    </div>
    <div class="filter-bottom">
      <div class="search-wrap">
        <span class="search-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" class="search-input" id="search-input" placeholder="Search by customer name…">
      </div>
      <select class="sort-select" id="sort-select">
        <option value="newest">Newest first</option>
        <option value="oldest">Oldest first</option>
        <option value="highest">Highest amount</option>
        <option value="lowest">Lowest amount</option>
      </select>
      <span class="results-count" id="results-count"></span>
      <a href="/" class="btn-new">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>New Bill
      </a>
    </div>
  </div>

  <div class="bills-container" id="bills-container"><div class="loading">Loading bills…</div></div>
</div>

<div class="modal-overlay" id="del-modal">
  <div class="modal">
    <h3>Delete Bill?</h3>
    <p>This will permanently delete this bill and cannot be undone.</p>
    <div class="modal-btns">
      <button class="modal-cancel" id="btn-cancel-del">Cancel</button>
      <button class="modal-confirm" id="btn-confirm-del">Yes, Delete</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
let allBills=[], shownBills=[], searchMode='name', pendingDeleteId=null;
setInterval(()=>fetch('/api/ping').catch(()=>{}), 4*60*1000);

document.addEventListener('DOMContentLoaded',()=>{
  fetch('/api/me').then(r=>r.json()).then(d=>{
    document.getElementById('user-name').textContent=d.name;
    document.getElementById('user-initials').textContent=d.name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  }).catch(()=>{});
  document.querySelectorAll('.stab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      searchMode=btn.dataset.mode;
      document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const ph={name:'Search by customer name…',phone:'Search by phone number…',billno:'Search by Bill No…'};
      document.getElementById('search-input').placeholder=ph[searchMode];
      document.getElementById('search-input').value='';
      applyFilter();
    });
  });
  document.getElementById('search-input').addEventListener('input',applyFilter);
  document.getElementById('sort-select').addEventListener('change',applyFilter);
  document.getElementById('btn-cancel-del').addEventListener('click',closeModal);
  document.getElementById('btn-confirm-del').addEventListener('click',doDelete);
  document.getElementById('bills-container').addEventListener('click',e=>{
    const card=e.target.closest('.bill-card');
    if(!card) return;
    const idx=parseInt(card.dataset.idx,10);
    const bill=shownBills[idx];
    if(!bill) return;
    if(e.target.closest('.act-edit')){ sessionStorage.setItem('editBill',JSON.stringify(bill)); location.href='/'; return; }
    if(e.target.closest('.act-delete')){ pendingDeleteId=bill.id; document.getElementById('del-modal').classList.add('show'); return; }
    if(e.target.closest('.bill-card-header')) card.classList.toggle('open');
  });
  loadBills();
});

function loadBills(){
  fetch('/api/bills').then(r=>r.json()).then(d=>{
    if(!d.ok) throw '';
    allBills=d.bills||[];
    updateStats(); applyFilter();
  }).catch(()=>{ document.getElementById('bills-container').innerHTML='<div class="loading">Could not load bills.</div>'; });
}
function doDelete(){
  if(!pendingDeleteId) return;
  const id=pendingDeleteId; closeModal();
  fetch('/api/bills/'+encodeURIComponent(id),{method:'DELETE'}).then(r=>r.json()).then(d=>{
    if(d.ok){ allBills=allBills.filter(b=>b.id!==id); updateStats(); applyFilter(); showToast('✓ Bill deleted','success'); }
    else showToast('Error: '+d.message,'error');
  }).catch(()=>showToast('Could not delete.','error'));
}
function closeModal(){ document.getElementById('del-modal').classList.remove('show'); pendingDeleteId=null; }
function updateStats(){
  document.getElementById('stat-total').textContent=allBills.length;
  const rev=allBills.reduce((s,b)=>s+(parseFloat(b.total)||0),0);
  document.getElementById('stat-rev').textContent='₹'+rev.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  const now=new Date();
  const mBills=allBills.filter(b=>{const d=new Date(b.savedAt);return d.getMonth()===now.getMonth()&&d.getFullYear()===now.getFullYear();});
  document.getElementById('stat-month').textContent=mBills.length;
  document.getElementById('stat-month-lbl').textContent=now.toLocaleString('default',{month:'long'})+' bills';
  if(allBills.length){const l=allBills[0];document.getElementById('stat-latest').textContent=l.billNo?'#'+l.billNo:(l.partyName||'–');document.getElementById('stat-latest-date').textContent=fmtDate(l.savedAt);}
}
function applyFilter(){
  const q=document.getElementById('search-input').value.toLowerCase().trim();
  const sort=document.getElementById('sort-select').value;
  let list=allBills.filter(b=>{
    if(!q) return true;
    if(searchMode==='name') return (b.partyName||'').toLowerCase().includes(q);
    if(searchMode==='phone') return (b.partyPhone||'').toLowerCase().includes(q);
    if(searchMode==='billno') return (b.billNo||'').toLowerCase().includes(q);
    return true;
  });
  if(sort==='oldest') list=[...list].reverse();
  if(sort==='highest') list=[...list].sort((a,b)=>(parseFloat(b.total)||0)-(parseFloat(a.total)||0));
  if(sort==='lowest') list=[...list].sort((a,b)=>(parseFloat(a.total)||0)-(parseFloat(b.total)||0));
  document.getElementById('results-count').textContent=q?list.length+' result'+(list.length!==1?'s':'')+' found':'';
  shownBills=list; renderBills(list,q);
}
function renderBills(bills,q){
  const c=document.getElementById('bills-container');
  if(!bills.length){c.innerHTML=`<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><h3>No bills found</h3><p>${q?'Try a different search term.':'No bills saved yet.'}</p></div>`;return;}
  c.innerHTML=bills.map((b,idx)=>buildCard(b,idx,q)).join('');
}
function buildCard(b,idx,q){
  const items=(b.items||[]).filter(i=>i.desc||i.qty||i.rate);
  const rowsHtml=items.length?items.map((it,i)=>`<tr><td>${i+1}</td><td class="dl">${esc(it.desc||'')}</td><td>${esc(it.qty||'')}</td><td>${esc(it.rate||'')}</td><td style="font-weight:600">${it.amount?'₹ '+esc(it.amount):''}</td></tr>`).join(''):`<tr><td colspan="5" style="color:#9ca3af;text-align:center;padding:10px;">No items</td></tr>`;
  const savedInfo='Saved by '+esc(b.savedByName||b.savedBy||'–')+' on '+fmtDate(b.savedAt)+(b.updatedAt?'<br>Updated by '+esc(b.updatedByName||b.updatedBy||'–')+' on '+fmtDate(b.updatedAt):'');
  function hl(t){if(!q||!t)return esc(t||'');const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');return esc(t).replace(re,'<mark>$1</mark>');}
  const nameDisp=searchMode==='name'?hl(b.partyName):esc(b.partyName||'');
  const billNoDisp=searchMode==='billno'?hl(b.billNo):esc(b.billNo||'');
  const phoneDisp=b.partyPhone?(searchMode==='phone'?hl(b.partyPhone):esc(b.partyPhone)):'';
  return `<div class="bill-card" data-idx="${idx}">
    <div class="bill-card-header">
      <div class="bill-num-badge">${billNoDisp?'#'+billNoDisp:'No No.'}</div>
      <div class="bill-card-info">
        <div class="bill-card-name">${nameDisp||'(No customer name)'}</div>
        <div class="bill-card-meta"><span>📅 ${esc(b.billDate||'–')}</span>${phoneDisp?`<span>📞 ${phoneDisp}</span>`:''}<span>📦 ${items.length} item${items.length!==1?'s':''}</span>${b.partyAddr?`<span>📍 ${esc(b.partyAddr)}</span>`:''}</div>
      </div>
      <div class="bill-card-total"><div class="bill-total-amt">₹ ${parseFloat(b.total||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}</div><div class="bill-total-label">${fmtDate(b.savedAt)}</div></div>
      <div class="card-toggle">⌄</div>
    </div>
    <div class="bill-detail"><div class="bill-detail-inner">
      <div class="mini-bill">
        <div class="mini-header"><div class="mini-shop-en">SHIV SHAKTI TILES</div><div class="mini-shop-gu">શિવ શક્તિ ટાઈલ્સ</div><div class="mini-addr">મહાનગર સોસાયટીની બાજુ માં, યમુના મીલ પાસે, ડભોઈ રોડ, વડોદરા – ૩૯૦ ૦૦૪.</div></div>
        <div class="mini-meta"><span><strong>No.:</strong> ${esc(b.billNo||'–')} &nbsp; Invoice / Delivery Memo</span><span><strong>તા.:</strong> ${esc(b.billDate||'–')}</span></div>
        <div class="mini-party"><div class="mini-party-row"><span class="mini-party-key">માલ લેનારનું નામ :</span><span>${esc(b.partyName||'–')}</span></div>${b.partyPhone?`<div class="mini-party-row"><span class="mini-party-key">ફોન નંબર :</span><span>${esc(b.partyPhone)}</span></div>`:''}<div class="mini-party-row"><span class="mini-party-key">ઠા. (સરનામું) :</span><span>${esc(b.partyAddr||'–')}</span></div></div>

        <div class="mini-footer"><div><strong>સૂચના :</strong><br>(૧) વેચેલો માલ પાછો લેવામાં આવશે નહીં.<br>(૨) માલ તપાસીને લેવો. પાછળથી તકરાર ચાલશે નહીં.</div><div><div style="font-size:11px;font-weight:600;margin-bottom:20px">સહી</div><div class="mini-sign-line">માલ લેનારની સહી</div></div></div>
        <div class="mini-gstin"><span><strong>GSTIN:</strong> 24ACCFS8163L1ZR</span><span>sureshpatel@sungranites.in | vishnupatel@sungranites.in</span></div>
      </div>
      <div class="bill-actions">
        <button class="act-btn act-edit"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>Edit Bill</button>
        <button class="act-btn act-delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>Delete</button>
        <div class="saved-by">${savedInfo}</div>
      </div>
    </div></div>
  </div>`;
}
function fmtDate(iso){if(!iso)return'–';return new Date(iso).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}
function showToast(msg,type){const t=document.getElementById('toast');t.textContent=msg;t.className=`toast toast-${type} show`;setTimeout(()=>t.className='toast',3000);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>
