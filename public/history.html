<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
  // Instant Auth Guard
  if (sessionStorage.getItem('isLoggedIn') !== 'true' || !sessionStorage.getItem('sessionId')) {
    window.location.replace('login.html');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiv Shakti Tiles – Bill History</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', Arial, sans-serif; background: #f1f5f9; min-height: 100vh; color: #0f172a; }

/* NAVBAR */
.topnav {
  background: #0f2847;
  padding: 0 24px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}
.nav-brand { display: flex; align-items: center; gap: 12px; }
.nav-logo {
  width: 34px;
  height: 34px;
  background: rgba(255,255,255,.12);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid rgba(255,255,255,.15);
}
.nav-logo svg { width: 20px; height: 20px; }
.nav-title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: .3px; }
.nav-title span { font-weight: 400; opacity: .7; font-size: 13px; margin-left: 6px; }
.nav-links { display: flex; gap: 6px; }
.nav-link {
  padding: 7px 16px;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 500;
  color: rgba(255,255,255,.75);
  text-decoration: none;
  transition: all .15s;
}
.nav-link:hover { background: rgba(255,255,255,.1); color: #fff; }
.nav-link.active { background: rgba(255,255,255,.18); color: #fff; }
.nav-right { display: flex; align-items: center; gap: 14px; }
.nav-user { font-size: 13px; color: rgba(255,255,255,.85); display: flex; align-items: center; gap: 8px; }
.user-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: #1a3a5c;
  border: 1px solid rgba(255,255,255,.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  color: #fff;
  text-transform: uppercase;
}
.btn-logout {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.2);
  color: #fff;
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all .15s;
}
.btn-logout:hover { background: rgba(255,255,255,.2); }

.page { padding: 24px; max-width: 1050px; margin: 0 auto; }

/* STATS METRICS */
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
.stat-card {
  background: #fff;
  border-radius: 10px;
  padding: 18px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.stat-label { font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: .8px; text-transform: uppercase; margin-bottom: 6px; }
.stat-val { font-size: 22px; font-weight: 800; color: #0f2847; }

/* FILTER TABS */
.filter-card {
  background: #fff;
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 20px;
  border: 1px solid #e2e8f0;
  box-shadow: 0 1px 3px rgba(0,0,0,.04);
}
.tab-row { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.tab-label { font-size: 13px; font-weight: 600; color: #475569; margin-right: 6px; }
.view-btn {
  padding: 8px 16px;
  border-radius: 20px;
  border: 1px solid #cbd5e1;
  background: #fff;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
  cursor: pointer;
  transition: all .15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.view-btn:hover { background: #f8fafc; }
.view-btn.active { background: #1a3a5c; color: #fff; border-color: #1a3a5c; }
.view-btn.btn-summary.active { background: #0284c7; border-color: #0284c7; color: #fff; }

.search-bar-row { display: flex; gap: 12px; flex-wrap: wrap; }
.search-input {
  flex: 1;
  min-width: 220px;
  padding: 10px 14px;
  border: 1.5px solid #e2e8f0;
  border-radius: 8px;
  font-size: 13.5px;
  outline: none;
  transition: all .15s;
}
.search-input:focus { border-color: #1a3a5c; }
.btn-export-excel {
  background: #16a34a;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
}
.btn-export-excel:hover { background: #15803d; }
.btn-new-bill {
  background: #0f2847;
  color: #fff;
  padding: 10px 18px;
  border-radius: 8px;
  font-weight: 700;
  font-size: 13px;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all .15s;
}
.btn-new-bill:hover { background: #1a3a5c; }

/* DATA TABLE */
.table-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #cbd5e1;
  overflow-x: auto;
  box-shadow: 0 4px 12px rgba(0,0,0,.03);
}
.data-table { width: 100%; border-collapse: collapse; text-align: left; }
.data-table th { background: #0f2847; color: #fff; padding: 12px 14px; font-size: 12.5px; font-weight: 700; }
.data-table td { padding: 10px 14px; border-bottom: 1px solid #e2e8f0; font-size: 13px; color: #0f172a; vertical-align: middle; }
.data-table tr:hover td { background: #f8fafc; }

/* SUMMARY REGISTER SPECIFIC STYLING */
.summary-table th { background: #1e293b; color: #f8fafc; border-right: 1px solid #334155; }
.summary-table td { border-right: 1px solid #e2e8f0; }
.editable-bill-input {
  padding: 6px 10px;
  border: 1.5px solid #cbd5e1;
  border-radius: 6px;
  font-size: 13px;
  font-weight: 700;
  color: #0f2847;
  width: 120px;
  outline: none;
  background: #fafafa;
  transition: all .15s;
}
.editable-bill-input:focus { border-color: #0284c7; background: #fff; box-shadow: 0 0 0 3px rgba(2,132,199,.15); }
.saved-indicator { font-size: 11px; color: #16a34a; font-weight: 600; margin-left: 6px; opacity: 0; transition: opacity .2s; }
.saved-indicator.show { opacity: 1; }

.action-link { color: #0284c7; font-weight: 600; text-decoration: none; margin-right: 10px; }
.action-link:hover { text-decoration: underline; }
.btn-del { color: #ef4444; background: none; border: none; cursor: pointer; font-weight: 600; font-size: 13px; }
.btn-del:hover { text-decoration: underline; }

.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #0f2847;
  color: #fff;
  padding: 12px 20px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 10px 20px rgba(0,0,0,.15);
  display: none;
  z-index: 9999;
}
.toast.show { display: block; }
</style>
</head>
<body>

<nav class="topnav">
  <div class="nav-brand">
    <div class="nav-logo">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="4" y="4" width="14" height="14" rx="2" fill="white"/>
        <rect x="22" y="4" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="4" y="22" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="22" y="22" width="14" height="14" rx="2" fill="white"/>
      </svg>
    </div>
    <div class="nav-title">SHIV SHAKTI TILES <span>Bill History</span></div>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">New Bill</a>
    <a href="history.html" class="nav-link active">Bill History</a>
    <a href="activity.html" class="nav-link">Login Dashboard</a>
  </div>
  <div class="nav-right">
    <div class="nav-user">
      <div class="user-avatar" id="userAvatar">A</div>
      <span id="userNameDisplay">Admin</span>
    </div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>

<div class="page">
  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Bills</div>
      <div class="stat-val" id="totalBillsCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Revenue</div>
      <div class="stat-val" id="totalRevenue">₹ 0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Latest Bill</div>
      <div class="stat-val" id="latestBillNo">-</div>
    </div>
  </div>

  <!-- FILTERS & TABS -->
  <div class="filter-card">
    <div class="tab-row">
      <span class="tab-label">Search / View by:</span>
      <button class="view-btn" id="btnByCust" onclick="setViewMode('cust')">👤 Customer Name</button>
      <button class="view-btn" id="btnByPhone" onclick="setViewMode('phone')">📞 Phone Number</button>
      <button class="view-btn" id="btnByChalan" onclick="setViewMode('chalan')">📄 Invoice No.</button>
      <button class="view-btn btn-summary active" id="btnSummary" onclick="setViewMode('summary')">📖 Summary Bill History</button>
    </div>

    <div class="search-bar-row">
      <input type="search" id="searchInput" class="search-input" placeholder="Search summary history..." oninput="renderTable()">
      <button class="btn-export-excel" onclick="exportToExcel()">📊 Export to Excel</button>
      <a href="index.html" class="btn-new-bill">+ New Bill</a>
    </div>
  </div>

  <!-- TABLE CONTAINER -->
  <div class="table-card">
    <table class="data-table summary-table" id="billsTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody">
        <tr>
          <td colspan="7" style="text-align: center; color: #64748b; padding: 24px;">Loading bills data...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast">Saved!</div>

<script>
let allBills = [];
let currentViewMode = 'summary';

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function getAuthHeaders() {
  const sessionId = sessionStorage.getItem('sessionId');
  return {
    'Content-Type': 'application/json',
    'x-session-id': sessionId || ''
  };
}

function initializeUserProfile() {
  const name = sessionStorage.getItem('username') || 'Admin';
  document.getElementById('userNameDisplay').textContent = name;
  document.getElementById('userAvatar').textContent = name.charAt(0).toUpperCase();
}

async function logout() {
  const sessionId = sessionStorage.getItem('sessionId');
  if (sessionId) {
    try {
      await fetch('/api/logout', {
        method: 'POST',
        headers: getAuthHeaders(),
        body: JSON.stringify({ sessionId })
      });
    } catch (err) {
      console.warn('Logout notification error:', err);
    }
  }
  sessionStorage.clear();
  window.location.replace('login.html');
}

window.addEventListener('DOMContentLoaded', () => {
  initializeUserProfile();
  fetchBills();
});

async function fetchBills() {
  try {
    const res = await fetch('/api/bills', {
      headers: getAuthHeaders()
    });
    
    if (res.status === 401 || res.status === 403) {
      logout();
      return;
    }
    if (!res.ok) throw new Error('Failed to fetch bills');
    allBills = await res.json();
    
    allBills.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));

    updateStats();
    renderTable();
  } catch (err) {
    console.error('Error loading bills:', err);
    document.getElementById('tableBody').innerHTML = `
      <tr><td colspan="7" style="text-align: center; color: #ef4444; padding: 24px;">Failed to load bills. Please refresh the page.</td></tr>
    `;
  }
}

function updateStats() {
  document.getElementById('totalBillsCount').textContent = allBills.length;
  
  let rev = 0;
  allBills.forEach(b => rev += parseFloat(b.grandTotal) || 0);
  document.getElementById('totalRevenue').textContent = `₹ ${rev.toFixed(2)}`;

  document.getElementById('latestBillNo').textContent = allBills.length > 0 ? (allBills[0].billNo || '#1') : '-';
}

function setViewMode(mode) {
  currentViewMode = mode;
  
  document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
  const searchInput = document.getElementById('searchInput');

  if (mode === 'cust') {
    document.getElementById('btnByCust').classList.add('active');
    searchInput.placeholder = 'Search by customer name...';
  } else if (mode === 'phone') {
    document.getElementById('btnByPhone').classList.add('active');
    searchInput.placeholder = 'Search by phone number...';
  } else if (mode === 'chalan') {
    document.getElementById('btnByChalan').classList.add('active');
    searchInput.placeholder = 'Search by Chalan / Invoice number...';
  } else if (mode === 'summary') {
    document.getElementById('btnSummary').classList.add('active');
    searchInput.placeholder = 'Search summary history...';
  }
  
  renderTable();
}

function getFilteredBills() {
  const query = document.getElementById('searchInput').value.toLowerCase().trim();
  return allBills.filter(b => {
    if (!query) return true;
    if (currentViewMode === 'cust') return (b.custName || '').toLowerCase().includes(query);
    if (currentViewMode === 'phone') return (b.custPhone || '').toLowerCase().includes(query);
    if (currentViewMode === 'chalan') return (b.billNo || '').toLowerCase().includes(query) || (b.officialBillNo || '').toLowerCase().includes(query);
    
    return (
      (b.custName || '').toLowerCase().includes(query) ||
      (b.custPhone || '').toLowerCase().includes(query) ||
      (b.billNo || '').toLowerCase().includes(query) ||
      (b.officialBillNo || '').toLowerCase().includes(query)
    );
  });
}

function renderTable() {
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');
  const filtered = getFilteredBills();

  if (currentViewMode === 'summary') {
    document.getElementById('billsTable').className = 'data-table summary-table';
    thead.innerHTML = `
      <tr>
        <th style="width: 110px;">Chalan No</th>
        <th>Date</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th style="width: 140px;">Official Bill No</th>
        <th style="text-align: right;">Total Amount</th>
        <th style="text-align: center; width: 140px;">Actions</th>
      </tr>
    `;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b; padding: 24px;">No matching records found.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(b => {
      const safeId = encodeURIComponent(b._id);
      return `
      <tr>
        <td><strong>${escapeHtml(b.billNo || '-')}</strong></td>
        <td>${escapeHtml(b.date || '-')}</td>
        <td><strong>${escapeHtml(b.custName || 'Cash Customer')}</strong></td>
        <td>${escapeHtml(b.custPhone || '-')}</td>
        <td>
          <div style="display: flex; align-items: center;">
            <input type="text" class="editable-bill-input" value="${escapeHtml(b.officialBillNo || '')}" 
              placeholder="Bill No" onchange="updateOfficialBillNo('${safeId}', this.value, this)">
            <span class="saved-indicator">✓</span>
          </div>
        </td>
        <td style="text-align: right; font-weight: 700; color: #0f2847;">₹ ${parseFloat(b.grandTotal || 0).toFixed(2)}</td>
        <td style="text-align: center;">
          <a href="index.html?id=${safeId}" class="action-link">✏️ Edit</a>
          <button class="btn-del" onclick="deleteBill('${safeId}')">🗑️ Delete</button>
        </td>
      </tr>
    `;
    }).join('');

  } else {
    document.getElementById('billsTable').className = 'data-table';
    thead.innerHTML = `
      <tr>
        <th>Chalan No</th>
        <th>Date</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th style="text-align: right;">Total Amount</th>
        <th style="text-align: center;">Actions</th>
      </tr>
    `;

    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #64748b; padding: 24px;">No matching records found.</td></tr>`;
      return;
    }

    tbody.innerHTML = filtered.map(b => {
      const safeId = encodeURIComponent(b._id);
      return `
      <tr>
        <td><strong>${escapeHtml(b.billNo || '-')}</strong></td>
        <td>${escapeHtml(b.date || '-')}</td>
        <td><strong>${escapeHtml(b.custName || 'Cash Customer')}</strong></td>
        <td>${escapeHtml(b.custPhone || '-')}</td>
        <td style="text-align: right; font-weight: 700; color: #0f2847;">₹ ${parseFloat(b.grandTotal || 0).toFixed(2)}</td>
        <td style="text-align: center;">
          <a href="index.html?id=${safeId}" class="action-link">✏️ Edit / Print</a>
          <button class="btn-del" onclick="deleteBill('${safeId}')">🗑️ Delete</button>
        </td>
      </tr>
    `;
    }).join('');
  }
}

function exportToExcel() {
  const filtered = getFilteredBills();

  if (!filtered || filtered.length === 0) {
    alert("No bill records available to export.");
    return;
  }

  const exportRows = filtered.map((b, index) => ({
    "Sr. No.": index + 1,
    "Chalan No": b.billNo || '-',
    "Date": b.date || '-',
    "Customer Name": b.custName || 'Cash Customer',
    "Phone No": b.custPhone || '-',
    "Official Bill No": b.officialBillNo || '-',
    "Total Amount (₹)": parseFloat(b.grandTotal || 0).toFixed(2)
  }));

  const worksheet = XLSX.utils.json_to_sheet(exportRows);

  worksheet['!cols'] = [
    { wch: 8 },
    { wch: 15 },
    { wch: 15 },
    { wch: 25 },
    { wch: 18 },
    { wch: 18 },
    { wch: 18 }
  ];

  const workbook = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(workbook, worksheet, "Summary Bill History");

  const dateStr = new Date().toISOString().slice(0, 10);
  XLSX.writeFile(workbook, `Summary_Bill_History_${dateStr}.xlsx`);
  
  showToast("Native Excel (.xlsx) downloaded!");
}

async function updateOfficialBillNo(encodedId, value, inputElem) {
  const id = decodeURIComponent(encodedId);
  try {
    const res = await fetch(`/api/bills/${id}`, {
      method: 'PATCH',
      headers: getAuthHeaders(),
      body: JSON.stringify({ officialBillNo: value })
    });
    
    if (res.status === 401 || res.status === 403) {
      logout();
      return;
    }

    if (res.ok) {
      const indicator = inputElem.nextElementSibling;
      if (indicator) {
        indicator.classList.add('show');
        setTimeout(() => indicator.classList.remove('show'), 1500);
      }
      showToast('Official Bill No updated!');
    } else {
      alert('Failed to update official bill number.');
    }
  } catch (err) {
    console.error(err);
    alert('Server connection error.');
  }
}

async function deleteBill(encodedId) {
  const id = decodeURIComponent(encodedId);
  if (!confirm('Are you sure you want to delete this bill? This cannot be undone.')) return;
  try {
    const res = await fetch(`/api/bills/${id}`, { 
      method: 'DELETE',
      headers: getAuthHeaders()
    });

    if (res.status === 401 || res.status === 403) {
      logout();
      return;
    }

    if (res.ok) {
      allBills = allBills.filter(b => b._id !== id);
      updateStats();
      renderTable();
      showToast('Bill deleted successfully');
    } else {
      alert('Failed to delete bill.');
    }
  } catch (err) {
    console.error(err);
    alert('Server connection error.');
  }
}

function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2500);
}

// --- AUTOMATIC DISCONNECT MONITOR ---
setInterval(async () => {
  const mySessionId = sessionStorage.getItem('sessionId');
  if (!mySessionId) {
    sessionStorage.clear();
    window.location.replace('login.html');
    return;
  }
  try {
    const res = await fetch('/api/session-ping', {
      method: 'POST',
      headers: getAuthHeaders(),
      body: JSON.stringify({ sessionId: mySessionId })
    });
    
    if (res.status === 401) {
      sessionStorage.clear();
      window.location.replace('login.html');
    }
  } catch (err) {
    // Ignore brief network hiccups
  }
}, 3000);
</script>
</body>
</html>
