<!DOCTYPE html>
<html lang="en">
<head>
<script>
  if (localStorage.getItem('isLoggedIn') !== 'true') {
    window.location.replace('login.html');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shiv Shakti Tiles – Bill History</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',Arial,sans-serif;background:#f1f5f9;min-height:100vh;color:#0f172a;}
/* NAVBAR */
.topnav{background:#0f2847;padding:0 24px;height:60px;display:flex;align-items:center;
  justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.nav-brand{display:flex;align-items:center;gap:12px;}
.nav-logo{width:34px;height:34px;background:rgba(255,255,255,.12);border-radius:8px;
  display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);}
.nav-logo svg{width:20px;height:20px;}
.nav-title{font-size:16px;font-weight:700;color:#fff;letter-spacing:.3px;}
.nav-title span{font-weight:400;opacity:.7;font-size:13px;margin-left:6px;}
.nav-links{display:flex;gap:6px;}
.nav-link{padding:7px 16px;border-radius:6px;font-size:13px;font-weight:500;
  color:rgba(255,255,255,.75);text-decoration:none;transition:all .15s;}
.nav-link:hover{background:rgba(255,255,255,.1);color:#fff;}
.nav-link.active{background:rgba(255,255,255,.18);color:#fff;}
.nav-right{display:flex;align-items:center;gap:14px;}
.nav-user{font-size:13px;color:rgba(255,255,255,.85);display:flex;align-items:center;gap:8px;}
.user-avatar{width:28px;height:28px;border-radius:50%;background:#1a3a5c;border:1px solid rgba(255,255,255,.3);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.btn-logout{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  color:#fff;padding:6px 14px;border-radius:6px;font-size:12px;font-weight:500;cursor:pointer;transition:all .15s;}
.page{padding:24px;max-width:1050px;margin:0 auto;}
/* STATS METRICS */
.stats-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:16px;margin-bottom:20px;}
.stat-card{background:#fff;border-radius:10px;padding:18px;border:1px solid #e2e8f0;
  box-shadow:0 1px 3px rgba(0,0,0,.04);}
.stat-label{font-size:11px;font-weight:700;color:#64748b;letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;}
.stat-val{font-size:22px;font-weight:800;color:#0f2847;}
/* FILTER TABS */
.filter-card{background:#fff;border-radius:12px;padding:18px 20px;margin-bottom:20px;
  border:1px solid #e2e8f0;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.tab-row{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.tab-label{font-size:13px;font-weight:600;color:#475569;margin-right:6px;}
.view-btn{padding:8px 16px;border-radius:20px;border:1px solid #cbd5e1;background:#fff;
  font-size:13px;font-weight:600;color:#334155;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:6px;}
.view-btn:hover{background:#f8fafc;}
.view-btn.active{background:#1a3a5c;color:#fff;border-color:#1a3a5c;}
.view-btn.btn-summary.active{background:#0284c7;border-color:#0284c7;color:#fff;}
.search-bar-row{display:flex;gap:12px;}
.search-input{flex:1;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:8px;
  font-size:13.5px;outline:none;transition:all .15s;}
.search-input:focus{border-color:#1a3a5c;}
.btn-new-bill{background:#0f2847;color:#fff;padding:10px 18px;border-radius:8px;
  font-weight:700;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
/* DATA TABLE */
.table-card{background:#fff;border-radius:12px;border:1px solid #cbd5e1;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.03);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{background:#0f2847;color:#fff;padding:12px 14px;font-size:12.5px;font-weight:700;text-align:left;}
.data-table td{padding:10px 14px;border-bottom:1px solid #e2e8f0;font-size:13px;color:#0f172a;vertical-align:middle;}
.data-table tr:hover td{background:#f8fafc;}
/* SUMMARY REGISTER SPECIFIC STYLING (Notebook Reference) */
.summary-table th{background:#1e293b;color:#f8fafc;border-right:1px solid #334155;}
.summary-table td{border-right:1px solid #e2e8f0;}
.editable-bill-input{padding:6px 10px;border:1.5px solid #cbd5e1;border-radius:6px;
  font-size:13px;font-weight:700;color:#0f2847;width:120px;outline:none;background:#fafafa;transition:all .15s;}
.editable-bill-input:focus{border-color:#0284c7;background:#fff;box-shadow:0 0 0 3px rgba(2,132,199,.15);}
.saved-indicator{font-size:11px;color:#16a34a;font-weight:600;margin-left:6px;opacity:0;transition:opacity .2s;}
.saved-indicator.show{opacity:1;}
.action-link{color:#0284c7;font-weight:600;text-decoration:none;margin-right:10px;}
.action-link:hover{text-decoration:underline;}
.btn-del{color:#ef4444;background:none;border:none;cursor:pointer;font-weight:600;}
.toast{position:fixed;bottom:24px;right:24px;background:#0f2847;color:#fff;
  padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;
  box-shadow:0 10px 20px rgba(0,0,0,.15);display:none;z-index:9999;}
.toast.show{display:block;}
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav-brand">
    <div class="nav-logo">
      <svg viewBox="0 0 40 40" fill="none">
        <rect x="4" y="4" width="14" height="14" rx="2" fill="white"/>
        <rect x="22" y="4" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="4" y="22" width="14" height="14" rx="2" fill="white" opacity=".5"/>
        <rect x="22" y="22" width="14" height="14" rx="2" fill="white"/>
      </svg>
    </div>
    <div class="nav-title">SHIV SHAKTI TILES <span>Bill History</span></div>
  </div>
  <div class="nav-links">
    <a href="index.html" class="nav-link">New Bill</a>
    <a href="history.html" class="nav-link active">Bill History</a>
  </div>
  <div class="nav-right">
    <div class="nav-user"><div class="user-avatar">A</div><span>Admin</span></div>
    <button class="btn-logout" onclick="logout()">Sign Out</button>
  </div>
</nav>
<div class="page">
  <!-- STATS -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Bills</div>
      <div class="stat-val" id="totalBillsCount">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Total Revenue</div>
      <div class="stat-val" id="totalRevenue">₹ 0.00</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Latest Bill</div>
      <div class="stat-val" id="latestBillNo">-</div>
    </div>
  </div>
  <!-- FILTERS & TABS -->
  <div class="filter-card">
    <div class="tab-row">
      <span class="tab-label">Search / View by:</span>
      <button class="view-btn active" id="btnByCust" onclick="setViewMode('cust')">👤 Customer Name</button>
      <button class="view-btn" id="btnByPhone" onclick="setViewMode('phone')">📞 Phone Number</button>
      <button class="view-btn" id="btnByChalan" onclick="setViewMode('chalan')">📄 Invoice No.</button>
      <button class="view-btn btn-summary" id="btnSummary" onclick="setViewMode('summary')">📖 Summary Bill History</button>
    </div>
    <div class="search-bar-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by customer name..." oninput="renderTable()">
      <a href="index.html" class="btn-new-bill">+ New Bill</a>
    </div>
  </div>
  <!-- TABLE CONTAINER -->
  <div class="table-card">
    <table class="data-table" id="billsTable">
      <thead id="tableHead"></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast">Saved!</div>
<script>
let allBills = [];
let currentViewMode = 'summary';

function logout() {
  localStorage.removeItem('isLoggedIn');
  localStorage.removeItem('user');
  window.location.replace('login.html');
}

window.addEventListener('DOMContentLoaded', fetchBills);

async function fetchBills() {
  try {
    const res = await fetch('/api/bills');
    if (!res.ok) throw new Error('Failed to fetch');
    allBills = await res.json();
    
    allBills.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
    updateStats();
    renderTable();
  } catch (err) {
    console.error('Error loading bills:', err);
  }
}

function updateStats() {
  document.getElementById('totalBillsCount').textContent = allBills.length;
  
  let rev = 0;
  allBills.forEach(b => rev += parseFloat(b.grandTotal) || 0);
  document.getElementById('totalRevenue').textContent = `₹ ${rev.toFixed(2)}`;
  document.getElementById('latestBillNo').textContent = allBills.length > 0 ? (allBills[0].billNo || '#1') : '-';
}

function setViewMode(mode) {
  currentViewMode = mode;
  
  document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
  
  const searchInput = document.getElementById('searchInput');
  if (mode === 'cust') {
    document.getElementById('btnByCust').classList.add('active');
    searchInput.placeholder = 'Search by customer name...';
  } else if (mode === 'phone') {
    document.getElementById('btnByPhone').classList.add('active');
    searchInput.placeholder = 'Search by phone number...';
  } else if (mode === 'chalan') {
    document.getElementById('btnByChalan').classList.add('active');
    searchInput.placeholder = 'Search by invoice / chalan no...';
  } else if (mode === 'summary') {
    document.getElementById('btnSummary').classList.add('active');
    searchInput.placeholder = 'Filter summary register by party name or chalan no...';
  }
  renderTable();
}

function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  const thead = document.getElementById('tableHead');
  const tbody = document.getElementById('tableBody');
  const table = document.getElementById('billsTable');
  let filtered = allBills.filter(b => {
    if (!q) return true;
    if (currentViewMode === 'cust') return (b.custName || '').toLowerCase().includes(q);
    if (currentViewMode === 'phone') return (b.custPhone || '').includes(q);
    if (currentViewMode === 'chalan') return (b.billNo || '').toLowerCase().includes(q);
    if (currentViewMode === 'summary') {
      return (b.custName || '').toLowerCase().includes(q) || 
             (b.billNo || '').toLowerCase().includes(q) ||
             (b.officialBillNo || '').toLowerCase().includes(q);
    }
    return true;
  });
  tbody.innerHTML = '';

  if (currentViewMode === 'summary') {
    table.className = 'data-table summary-table';
    thead.innerHTML = `
      <tr>
        <th style="width:130px;">Date</th>
        <th style="width:130px;">Chalan No.</th>
        <th>Party Name</th>
        <th style="width:200px;">Bill No. (Editable)</th>
        <th style="width:100px; text-align:center;">Action</th>
      </tr>
    `;
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#94a3b8; padding:24px;">No summary bills found. Create a bill on the main page to populate rows automatically.</td></tr>`;
      return;
    }
    filtered.forEach(b => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:600; color:#334155;">${b.date || formatDate(b.createdAt)}</td>
        <td style="font-weight:700; color:#0f2847;">${b.billNo || '-'}</td>
        <td style="font-weight:600;">${b.custName || 'Cash Customer'}</td>
        <td>
          <input type="text" class="editable-bill-input" value="${b.officialBillNo || ''}" 
                 placeholder="Enter Bill No." 
                 onchange="updateOfficialBillNo('${b._id}', this.value, this)">
          <span class="saved-indicator" id="ind-${b._id}">✓ Saved</span>
        </td>
        <td style="text-align:center;">
          <a href="index.html?id=${b._id}" class="action-link">Edit / View</a>
          <button class="btn-del" onclick="deleteBill('${b._id}')">✕</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  } else {
    table.className = 'data-table';
    thead.innerHTML = `
      <tr>
        <th>Chalan / Invoice No.</th>
        <th>Date</th>
        <th>Customer Name</th>
        <th>Phone</th>
        <th style="text-align:right;">Amount (₹)</th>
        <th style="text-align:center;">Actions</th>
      </tr>
    `;
    if (filtered.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8; padding:24px;">No bills found.</td></tr>`;
      return;
    }
    filtered.forEach(b => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td style="font-weight:700; color:#0f2847;">${b.billNo || '-'}</td>
        <td>${b.date || formatDate(b.createdAt)}</td>
        <td style="font-weight:600;">${b.custName || 'Cash Customer'}</td>
        <td>${b.custPhone || '-'}</td>
        <td style="text-align:right; font-weight:700;">₹ ${parseFloat(b.grandTotal || 0).toFixed(2)}</td>
        <td style="text-align:center;">
          <a href="index.html?id=${b._id}" class="action-link">Edit / Print</a>
          <button class="btn-del" onclick="deleteBill('${b._id}')">Delete</button>
        </td>
      `;
      tbody.appendChild(tr);
    });
  }
}

async function updateOfficialBillNo(billId, newBillNo, inputEl) {
  try {
    const res = await fetch(`/api/bills/${billId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ officialBillNo: newBillNo })
    });
    if (res.ok) {
      const targetBill = allBills.find(b => b._id === billId);
      if (targetBill) targetBill.officialBillNo = newBillNo;
      const ind = document.getElementById(`ind-${billId}`);
      if (ind) {
        ind.classList.add('show');
        setTimeout(() => ind.classList.remove('show'), 2000);
      }
    } else {
      alert('Failed to update Bill No.');
    }
  } catch (err) {
    console.error('Update error:', err);
    alert('Failed to connect to server.');
  }
}

async function deleteBill(id) {
  if (confirm('Are you sure you want to delete this bill?')) {
    try {
      const res = await fetch(`/api/bills/${id}`, { method: 'DELETE' });
      if (res.ok) {
        allBills = allBills.filter(b => b._id !== id);
        updateStats();
        renderTable();
      }
    } catch (err) {
      alert('Failed to delete bill.');
    }
  }
}

function formatDate(isoStr) {
  if (!isoStr) return '-';
  const d = new Date(isoStr);
  return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()}`;
}
</script>
</body>
</html>
